version: '3.8'

services:
  # 1. Feature Extraction (Data Ingestion)
  data_ingest:
    build: .
    container_name: iotguard-ingest
    command: python scripts/1_data_input/suricata_to_features.py
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    environment:
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped

  # 2. ML Inference Engine
  decision_engine:
    build: .
    container_name: iotguard-decision
    command: python scripts/3_inference/decision_loop.py
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    environment:
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped
    depends_on:
      - data_ingest

  # 3. Web API & Dashboard
  dashboard:
    build: .
    container_name: iotguard-dashboard
    privileged: true  # Required for raw sockets in the Attack Simulator
    command: python scripts/5_dashboard/api_dashboard.py
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./logs:/app/logs
    environment:
      - IOTGUARD_HOST=0.0.0.0
      - IOTGUARD_PORT=5001
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped
    depends_on:
      - decision_engine
