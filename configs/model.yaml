features:
- flows
- bytes_total
- pkts_total
- syn_ratio
- mean_bytes_flow
- ack_ratio
- fin_ratio
- rst_ratio
- http_ratio
- tcp_ratio
- protocol_diversity
- std_bytes
- iat_mean
models:
  iot:
    path: models/lightgbm.joblib
    meta: models/model_meta.json
    threshold: 0.9
  it:
    path: models/lightgbm_it.joblib
    meta: models/model_meta_it.json
    threshold: 0.9
lgbm:
  n_estimators: 250
  num_leaves: 64
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
decision:
  threshold: 0.65
  grace: 3
  window: 5
  cooldown_sec: 30
  instant_block: 0.95
  dry_run: true
  firewall_backend: auto
  xdp_interface: eth0
  xdp_mode: auto
  use_adaptive: false
unsupervised:
  enabled: true
  model_path: models/unsup_isoforest.joblib
  meta_path: models/unsup_meta.json
  train_on: benign_only
  contamination: 0.05
  n_estimators: 200
  max_samples: 1.0
  random_state: 42
  fallback_quantile: 0.99
hybrid:
  mode: hybrid
  unsup_threshold: null
  combine_strategy: or
  supervised_weight: 0.7
  unsupervised_weight: 0.3
  unsup_only_label: ANOMALY (unsupervised)
ensemble:
  strategy: weighted
  supervised_weight: 0.7
  unsupervised_weight: 0.3
  calibrate: true
temporal:
  enabled: true
  window_size: 8
  min_windows: 4
  drift_threshold: 0.5
  boost_weight: 0.25
  features:
  - rst_ratio
  - syn_ratio
  - flows
  - http_ratio
alerts:
  min_severity: medium
  email_enabled: false
  slack_enabled: false
